name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'Lektion */slidev/**'
      - 'index.template.html'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Determine changed lectures
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            find . -type f -path "./Lektion */slidev/package.json" \
              | while read -r pkg; do
                  slidev_dir="$(dirname "$pkg")"
                  lesson_dir="$(dirname "$slidev_dir")"
                  basename "$lesson_dir"
                done | sort -u > changed_lessons.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" \
              | grep -E '^Lektion [^/]+/slidev/' \
              | sed -E 's#^(Lektion [^/]+)/.*#\1#' \
              | sort -u > changed_lessons.txt || true
          fi

          echo "Changed lessons:"
          cat changed_lessons.txt || true

          if [ ! -s changed_lessons.txt ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare gh-pages worktree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf gh-pages
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          cd gh-pages

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Build changed Slidev decks
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          REPO_NAME="${{ github.event.repository.name }}"

          while read -r lesson_name; do
            [ -n "$lesson_name" ] || continue

            slidev_dir="$lesson_name/slidev"
            slug="$(echo "$lesson_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+/-/g')"

            echo "Building $lesson_name"
            npm ci --prefix "$slidev_dir"
            npm run build --prefix "$slidev_dir" -- --base "/$REPO_NAME/$slug/"

            rm -rf "gh-pages/$slug"
            mkdir -p "gh-pages/$slug"
            rsync -a --delete "$slidev_dir/dist/" "gh-pages/$slug/"
          done < changed_lessons.txt

      - name: Rebuild index.html
        shell: bash
        run: |
          set -euo pipefail

          cp index.template.html gh-pages/index.html
          LINKS_FILE="$(mktemp)"

          find . -type f -path "./Lektion */slidev/package.json" \
            | while read -r pkg; do
                slidev_dir="$(dirname "$pkg")"
                lesson_dir="$(dirname "$slidev_dir")"
                lesson_name="$(basename "$lesson_dir")"
                number="$(echo "$lesson_name" | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
                slug="$(echo "$lesson_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+/-/g')"
                printf "%06d\t%s\t%s\n" "$number" "$lesson_name" "$slug"
              done \
            | sort -n \
            | while IFS=$'\t' read -r number lesson_name slug; do
                echo "    <li><a href=\"./$slug/\">$lesson_name</a></li>" >> "$LINKS_FILE"
              done

          sed -i '/<!-- LECTURE_LINKS -->/r '"$LINKS_FILE" gh-pages/index.html
          rm "$LINKS_FILE"

      - name: Commit and push site
        shell: bash
        run: |
          set -euo pipefail
          cd gh-pages

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Publish pages from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
