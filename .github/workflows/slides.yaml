name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Build Slidev decks + generate index
        shell: bash
        run: |
          set -euo pipefail

          REPO_NAME="${{ github.event.repository.name }}"
          OUT_DIR="site"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # Collect lecture info with numeric sort key
          mapfile -t ENTRIES < <(
            find . -type f -path "./Lektion */slidev/package.json" \
            | while read -r pkg; do
                slidev_dir="$(dirname "$pkg")"
                lesson_dir="$(dirname "$slidev_dir")"
                lesson_name="$(basename "$lesson_dir")"
                number="$(echo "$lesson_name" | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
                printf "%06d\t%s\t%s\n" "$number" "$lesson_name" "$slidev_dir"
              done \
            | sort -n
          )

          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "No Slidev projects found."
            exit 1
          fi

          for entry in "${ENTRIES[@]}"; do
            IFS=$'\t' read -r number lesson_name slidev_dir <<< "$entry"

            slug="$(echo "$lesson_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+/-/g')"

            echo "Building $lesson_name"

            npm ci --prefix "$slidev_dir"
            npm run build --prefix "$slidev_dir" -- --base "/$REPO_NAME/$slug/"

            mkdir -p "$OUT_DIR/$slug"
            rsync -a --delete "$slidev_dir/dist/" "$OUT_DIR/$slug/"
          done

          # Generate index from template
          cp index.template.html "$OUT_DIR/index.html"

          LINKS_FILE="$(mktemp)"

          for entry in "${ENTRIES[@]}"; do
            IFS=$'\t' read -r number lesson_name slidev_dir <<< "$entry"
            slug="$(echo "$lesson_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+/-/g')"

            echo "    <li><a href=\"./$slug/\">$lesson_name</a></li>" >> "$LINKS_FILE"
          done

          sed -i '/<!-- LECTURE_LINKS -->/r '"$LINKS_FILE" "$OUT_DIR/index.html"
          rm "$LINKS_FILE"

      - name: Debug output
        run: |
          echo "== site top =="
          ls -la site || true
          echo "== files (maxdepth 2) =="
          find site -maxdepth 2 -type f | head -n 100 || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
