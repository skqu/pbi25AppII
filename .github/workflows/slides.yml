name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Build all Slidev decks
        shell: bash
        run: |
          set -euo pipefail

          REPO_NAME="${{ github.event.repository.name }}"
          OUT_DIR="site"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # Find alle slidev-projekter under "Lektion */slidev"
          mapfile -d '' SLIDEV_DIRS < <(
            find . -type f -path "./Lektion */slidev/package.json" -print0 \
            | xargs -0 -n1 dirname \
            | sort -u \
            | tr '\n' '\0'
          )

          if [ "${#SLIDEV_DIRS[@]}" -eq 0 ]; then
            echo "Ingen Slidev projekter fundet under './Lektion */slidev'."
            exit 1
          fi

          echo "Fundne Slidev projekter:"
          printf ' - %s\n' "${SLIDEV_DIRS[@]}"

          INDEX_FILE="$OUT_DIR/index.html"
          cat > "$INDEX_FILE" <<'HTML'
          <!doctype html>
          <html lang="da">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Slides</title>
            <style>
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
              h1 { margin-bottom: 1rem; }
              ul { line-height: 1.9; padding-left: 1.2rem; }
              a { text-decoration: none; }
              a:hover { text-decoration: underline; }
              .hint { color: #666; font-size: .95rem; margin-top: .5rem; }
            </style>
          </head>
          <body>
            <h1>Slides</h1>
            <ul>
          HTML

          for DIR in "${SLIDEV_DIRS[@]}"; do
            LESSON_DIR="$(dirname "$DIR")"
            LESSON_NAME="$(basename "$LESSON_DIR")"

            SLUG="$(echo "$LESSON_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+/-/g')"

            echo ""
            echo "==> Bygger: $LESSON_NAME ($DIR) -> /$REPO_NAME/$SLUG/"

            npm ci --prefix "$DIR"
            npm run build --prefix "$DIR" -- --base "/$REPO_NAME/$SLUG/"

            mkdir -p "$OUT_DIR/$SLUG"
            rsync -a --delete "$DIR/dist/" "$OUT_DIR/$SLUG/"

            echo "              <li><a href=\"./$SLUG/\">$LESSON_NAME</a></li>" >> "$INDEX_FILE"
          done

          cat >> "$INDEX_FILE" <<'HTML'
            </ul>
            <p class="hint">Automatisk genereret af GitHub Actions.</p>
          </body>
          </html>
          HTML

      - name: Debug output
        run: |
          echo "== site top =="
          ls -la site || true
          echo "== files (maxdepth 2) =="
          find site -maxdepth 2 -type f | head -n 100 || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
