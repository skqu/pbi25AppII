name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          # cache alle lockfiles i repoet (når du får flere lektioner)
          cache-dependency-path: "**/package-lock.json"

      - name: Build all Slidev decks
        shell: bash
        run: |
          set -euo pipefail

          REPO_NAME="${{ github.event.repository.name }}"
          OUT_DIR="site"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # Find alle slidev-projekter under "Lektion */slidev"
          # (tilpas evt. hvis du senere ændrer navngivning)
          mapfile -d '' SLIDEV_DIRS < <(find . -type f -path "./Lektion */slidev/package.json" -print0 | xargs -0 -n1 dirname | sort -u | tr '\n' '\0')

          if [ "${#SLIDEV_DIRS[@]}" -eq 0 ]; then
            echo "Ingen Slidev projekter fundet under './Lektion */slidev'."
            exit 1
          fi

          echo "Fundne Slidev projekter:"
          printf ' - %s\n' "${SLIDEV_DIRS[@]}"

          # Byg en simpel index-side
          INDEX_FILE="$OUT_DIR/index.html"
          cat > "$INDEX_FILE" <<'HTML'
          <!doctype html>
          <html lang="da">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Slides</title>
            <style>
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
              h1 { margin-bottom: 1rem; }
              ul { line-height: 1.9
